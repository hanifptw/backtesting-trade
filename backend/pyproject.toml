[project]
name = "backtesting-trade-backend"
version = "0.1.0"
description = "Local crypto backtesting web app — backend (FastAPI + backtesting.py + CCXT)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "backtesting>=0.6.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
